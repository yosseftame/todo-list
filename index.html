<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div class="container" id="container">
        <div class="header">
          <h1>My To-Do List</h1>
          <p><span id="spanVal">0</span>task(s)</p>
        </div>
        <div class="inp">
          <input id="input" type="text" placeholder="Add a new taks..." />
          <button id="btn">+</button>
        </div>
        <div class="tasks-container" id="taksContainer"></div>
      </div>
    </section>
    
    <script src="app.js"></script>
    <script
      src="https://kit.fontawesome.com/66b59c68df.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
